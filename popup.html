<!DOCTYPE html>
<html>
<head>
  <title>Pokemon Showdown Plus</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="psplus-title">PS+</div>
    <div class="options">
        <div class="switch-row">
            <span class="switch-label">Enable Addon</span>
            <label class="switch">
            <input type="checkbox" id="toggleAddon" />
            <span class="slider"></span>
            </label>
        </div>
        <div class="switch-row">
            <span class="switch-label">Type Chart</span>
            <label class="switch">
            <input type="checkbox" id="toggleTypeChart" />
            <span class="slider"></span>
            </label>
        </div>
        <div class="switch-row">
            <span class="switch-label">Rand Stats</span>
            <label class="switch">
            <input type="checkbox" id="toggleStats" />
            <span class="slider"></span>
            </label>
        </div>
        <div class="switch-row">
            <span class="switch-label">Rand Movesets</span>
            <label class="switch">
            <input type="checkbox" id="toggleMovesets" />
            <span class="slider"></span>
            </label>
        </div>
    </div>
  <script src="popup.js"></script>
</body>
</html>
